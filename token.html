<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Token · Pons Fork</title>
<meta name="description" content="Live Pons Fork status for a token on Robinhood Chain — mode, supply burned, and whether fees are currently routed to Pons Fork." />
<style>
  :root{
    --ink:#0f1830;--mut:#5b6a86;--faint:#8a97b0;--line:rgba(20,30,60,.09);
    --glass:rgba(255,255,255,.6);--glass2:rgba(255,255,255,.74);
    --ember:#ef6a34;--ember-ink:#b8410f;--ember-bg:rgba(239,106,52,.12);
    --mint:#12b886;--mint-ink:#0a7a55;--mint-bg:rgba(18,184,134,.13);
    --red:#d23c3c;--red-bg:rgba(210,60,60,.1);
    --brand:#4b62f5;--brand-ink:#2c40c9;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0}
  html,body{background:#eef2f8}
  body{font-family:var(--font);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;position:relative;overflow-x:hidden}
  .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;z-index:0;pointer-events:none}
  .b1{width:480px;height:480px;background:#8fe3c6;top:-150px;left:-120px}
  .b2{width:420px;height:420px;background:#ffc7a8;top:80px;right:-140px}
  .b3{width:480px;height:480px;background:#bcc6ff;bottom:-220px;left:35%}
  .wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:0 20px 40px}
  .glass{background:var(--glass);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);
    border:1px solid rgba(255,255,255,.75);border-radius:20px;box-shadow:0 10px 40px rgba(24,38,72,.10)}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

  .nav{display:flex;align-items:center;gap:14px;margin-top:16px;padding:11px 16px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;text-decoration:none;color:var(--ink)}
  .logo{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--mint),var(--brand));font-size:14px}
  .sp{flex:1}
  .nav a.link{color:var(--mut);text-decoration:none;font-size:14px;font-weight:500}
  .nav a.link:hover{color:var(--ink)}
  .connect{position:relative}
  .connect button{font:inherit;font-size:13.5px;font-weight:600;color:#fff;cursor:not-allowed;background:linear-gradient(135deg,var(--brand),#6f7ff8);border:0;padding:8px 14px;border-radius:10px}
  .connect .soon{position:absolute;top:calc(100% + 8px);right:0;white-space:nowrap;font-size:12px;color:#fff;background:#12203a;padding:5px 10px;border-radius:8px;opacity:0;transition:.15s;pointer-events:none}
  .connect:hover .soon{opacity:1}

  .card{margin-top:18px;padding:26px 26px}
  .tk{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .tk .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:18px;font-family:var(--mono);flex:none;background:var(--brand);color:#fff}
  .tk h1{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
  .tk .sym{color:var(--faint);font-weight:500;font-size:15px}
  .addr{display:inline-flex;align-items:center;gap:8px;margin-top:8px;font-family:var(--mono);font-size:13px;color:var(--mut);
    background:var(--glass2);border:1px solid var(--line);padding:6px 11px;border-radius:9px}
  .addr .cp{cursor:pointer;color:var(--faint)} .addr .cp:hover{color:var(--ink)}

  .status{margin-top:22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 20px;border-radius:16px}
  .status.on{background:var(--mint-bg);border:1px solid rgba(18,184,134,.3)}
  .status.off{background:var(--red-bg);border:1px solid rgba(210,60,60,.3)}
  .status .dot{width:12px;height:12px;border-radius:50%;flex:none}
  .status.on .dot{background:var(--mint);box-shadow:0 0 0 4px rgba(18,184,134,.2)}
  .status.off .dot{background:var(--red)}
  .status .txt{font-weight:700;font-size:16px}
  .status.on .txt{color:var(--mint-ink)} .status.off .txt{color:var(--red)}
  .status .mode{margin-left:auto;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px}
  .status .mode.a{color:var(--ember-ink);background:var(--ember-bg)}
  .status .mode.c{color:var(--mint-ink);background:#d7f5ea}
  .status .sub{flex-basis:100%;font-size:13px;color:var(--mut);font-weight:400}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
  .st{padding:16px 18px}
  .st .l{font-size:12px;color:var(--faint);font-weight:500}
  .st .v{font-size:22px;font-weight:700;margin-top:7px;font-family:var(--mono);letter-spacing:-.01em}
  .st .v.a{color:var(--ember-ink)} .st .v.c{color:var(--mint-ink)}
  .st .v small{font-size:13px;color:var(--faint);font-weight:600}

  .prog{height:8px;border-radius:5px;background:rgba(20,30,60,.08);overflow:hidden;margin-top:16px}
  .prog i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--ember),#ff9a6a);width:0;transition:width .6s}

  .foot{margin-top:20px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13.5px}
  .foot a{color:var(--brand-ink);text-decoration:none;font-weight:500}
  .foot a:hover{text-decoration:underline}
  .foot .sp{flex:1}
  .muted{color:var(--faint);font-size:12.5px}
  .loading{padding:60px 0;text-align:center;color:var(--mut)}
  .spin{width:26px;height:26px;border:3px solid rgba(75,98,245,.25);border-top-color:var(--brand);border-radius:50%;display:inline-block;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .err{padding:40px 26px;text-align:center;color:var(--mut)}
  .err a{color:var(--brand-ink)}
</style>
</head>
<body>
<span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
<div class="wrap">
  <nav class="nav glass">
    <a class="brand" href="../"><span class="logo">♦</span> Pons Fork</a>
    <div class="sp"></div>
    <a class="link" href="https://pons-fork.gitbook.io/pons-fork-docs/">Docs ↗</a>
    <a class="link" href="https://x.com/pons_fork">X ↗</a>
    <span class="connect"><button>Connect wallet</button><span class="soon">Coming soon</span></span>
  </nav>

  <div id="app">
    <div class="card glass"><div class="loading"><span class="spin"></span><div style="margin-top:14px">Reading Robinhood Chain…</div></div></div>
  </div>
</div>

<script type="module">
import { createPublicClient, http, getAddress, isAddress, formatUnits, erc20Abi, parseAbi } from "https://esm.sh/viem@2.23.2";

const RPC="https://rpc.mainnet.chain.robinhood.com";
const EXPLORER="https://robinhoodchain.blockscout.com";
const LOCKER="0x736D76699C26D0d966744cAe304C000d471f7F35";
const FACTORY="0xA5aAb3F0c6EeadF30Ef1D3Eb997108E976351feB";
const AGENTIC="0x31A4F14D8ac9E89F2Ac6000b375B125468Cd1AF3";
const CASHBACK="0x6ab6bD6416997Ad39cBDA34C9b2Fc912D57A8eF4";
const DEAD="0x000000000000000000000000000000000000dEaD";

const lockerAbi=parseAbi(["function feeRedirects(address) view returns (address)"]);
const factoryAbi=parseAbi(["function getLaunchedToken(address token) view returns ((address token,address deployer,address pairedToken,address positionManager,uint256 positionId,uint256 dexId,uint256 launchConfigId,uint256 restrictionsEndBlock,uint256 supply,bool isToken0,uint24 poolFee,bool exists,uint256 initialBuyAmount) info)"]);
const pc=createPublicClient({transport:http(RPC)});
const app=document.getElementById("app");
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const short=a=>a.slice(0,6)+"…"+a.slice(-4);
function fmt(n){ if(n>=1e9)return (n/1e9).toFixed(2)+"B"; if(n>=1e6)return (n/1e6).toFixed(2)+"M"; if(n>=1e3)return (n/1e3).toFixed(2)+"K"; return n<1?n.toFixed(3):Math.round(n).toString(); }

function readAddr(){
  const p=location.pathname; const i=p.indexOf("/token/");
  let a = i>=0 ? p.slice(i+7) : "";
  a=a.replace(/\/+$/,"").split("?")[0].split("#")[0];
  if(!a){ const u=new URLSearchParams(location.search); a=u.get("a")||u.get("address")||""; }
  return a;
}

async function main(){
  const raw=readAddr();
  if(!raw || !isAddress(raw)){
    app.innerHTML=`<div class="card glass"><div class="err">Open a token by its address:<br><span class="mono">ponsfork.com/token/0x…</span><br><br><a href="../">← back to Pons Fork</a></div></div>`;
    return;
  }
  const token=getAddress(raw);
  document.title=short(token)+" · Pons Fork";
  try{
    const [name,symbol,supply,decimals,burnedBal,redir,info]=await Promise.all([
      pc.readContract({address:token,abi:erc20Abi,functionName:"name"}).catch(()=> "Unknown"),
      pc.readContract({address:token,abi:erc20Abi,functionName:"symbol"}).catch(()=> "?"),
      pc.readContract({address:token,abi:erc20Abi,functionName:"totalSupply"}).catch(()=>0n),
      pc.readContract({address:token,abi:erc20Abi,functionName:"decimals"}).catch(()=>18),
      pc.readContract({address:token,abi:erc20Abi,functionName:"balanceOf",args:[DEAD]}).catch(()=>0n),
      pc.readContract({address:LOCKER,abi:lockerAbi,functionName:"feeRedirects",args:[token]}).catch(()=>"0x0000000000000000000000000000000000000000"),
      pc.readContract({address:FACTORY,abi:factoryAbi,functionName:"getLaunchedToken",args:[token]}).catch(()=>null),
    ]);
    const dec=Number(decimals);
    const sup=Number(formatUnits(supply,dec));
    const burned=Number(formatUnits(burnedBal,dec));
    const burnedPct = sup>0 ? (burned/sup*100) : 0;
    const recip=getAddress(redir);
    const isAgentic = recip===getAddress(AGENTIC);
    const isCashback = recip===getAddress(CASHBACK);
    const enabled = isAgentic || isCashback;
    const mode = isAgentic ? "agentic" : isCashback ? "cashback" : "";
    const deployer = info ? info.deployer : "";

    const statusHtml = enabled
      ? `<div class="status on"><span class="dot"></span><span class="txt">Ponsfork enabled</span>
           <span class="mode ${isAgentic?'a':'c'}">${isAgentic?'🔥 Agentic Mode':'💸 Cashback'}</span>
           <span class="sub">Fees are routed to Pons Fork right now — ${isAgentic?'bought back &amp; burned':'paid to holders in ETH'}, automatically.</span></div>`
      : `<div class="status off"><span class="dot"></span><span class="txt">Not connected</span>
           <span class="sub">This token's fees are not routed to Pons Fork right now. Anyone can point them at Agentic Mode or Cashback — only the token's dev.</span></div>`;

    app.innerHTML=`
      <div class="card glass">
        <div class="tk">
          <div class="ic">${esc(String(symbol).slice(0,3).toUpperCase())}</div>
          <div><h1>${esc(name)} <span class="sym">$${esc(symbol)}</span></h1>
            <div class="addr"><span>${short(token)}</span><span class="cp" id="cp" title="copy">⧉</span>
              <a href="${EXPLORER}/address/${token}" target="_blank" style="color:var(--brand-ink);text-decoration:none">explorer ↗</a></div>
          </div>
        </div>
        ${statusHtml}
        <div class="stats">
          <div class="st glass"><div class="l">🔥 Supply burned</div><div class="v a">${burnedPct.toFixed(2)}<small>%</small></div></div>
          <div class="st glass"><div class="l">Tokens burned</div><div class="v">${fmt(burned)}</div></div>
          <div class="st glass"><div class="l">Total supply</div><div class="v">${fmt(sup)}</div></div>
          <div class="st glass"><div class="l">Deployer</div><div class="v" style="font-size:14px">${deployer?short(deployer):"—"}</div></div>
        </div>
        <div class="prog"><i style="width:${Math.min(burnedPct,100)}%"></i></div>
        <div class="foot">
          <a href="${EXPLORER}/address/${token}" target="_blank">View on explorer ↗</a>
          <span class="sp"></span>
          <span class="muted">Live from Robinhood Chain${enabled?"":" · not connected"}</span>
        </div>
      </div>
      <div class="foot" style="justify-content:center;margin-top:14px"><a href="../">← All Pons Fork tokens</a></div>`;

    const cp=document.getElementById("cp");
    if(cp) cp.onclick=()=>{navigator.clipboard?.writeText(token);cp.textContent="✓";setTimeout(()=>cp.textContent="⧉",1200);};
  }catch(e){
    app.innerHTML=`<div class="card glass"><div class="err">Couldn't load this token.<br><span class="muted">${esc(e.message||"")}</span><br><br><a href="../">← back to Pons Fork</a></div></div>`;
  }
}
main();
</script>
</body>
</html>
