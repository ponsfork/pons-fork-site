<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Token · Pons Fork</title>
<meta name="description" content="Live Pons Fork status for a token on Robinhood Chain — mode, supply burned, and whether fees are currently routed to Pons Fork." />
<link rel="icon" type="image/jpeg" href="/favicon.jpg" />
<link rel="apple-touch-icon" href="/favicon.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f6f6f1;--ink:#121513;--mut:#5c635d;--faint:#9aa39c;
    --line:rgba(18,21,19,.09);--card:#ffffff;
    --burn:#ea580c;--burn-bg:rgba(234,88,12,.1);
    --hold:#0e9f6e;--hold-bg:rgba(14,159,110,.1);
    --heart:#d6336c;--heart-bg:rgba(214,51,108,.09);
    --red:#d23c3c;--red-bg:rgba(210,60,60,.08);
    --sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
    --serif:"Instrument Serif",Georgia,serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0}
  html,body{background:var(--bg)}
  body{font-family:var(--sans);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;font-size:15px;min-height:100vh}
  .wrap{max-width:820px;margin:0 auto;padding:0 24px 48px}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

  .nav{display:flex;align-items:center;gap:18px;padding:20px 0;border-bottom:1px solid var(--line)}
  .brand{display:inline-flex;align-items:center;text-decoration:none;line-height:0}
  .brand-logo{height:84px;width:auto;display:block;mix-blend-mode:multiply;transition:opacity .15s}
  .brand:hover .brand-logo{opacity:.7}
  .sp{flex:1}
  .nav a.link{color:var(--mut);text-decoration:none;font-size:13.5px}
  .nav a.link:hover{color:var(--ink)}
  .connect{position:relative}
  .connect button{font:inherit;font-size:13px;font-weight:500;color:var(--bg);cursor:pointer;background:var(--ink);border:0;padding:8px 16px;border-radius:999px;transition:.15s}
  .connect button:hover{opacity:.85}

  .card{margin-top:26px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px}
  .tk{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .tk .ic{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:16px;font-family:var(--mono);flex:none;background:var(--ink);color:var(--bg)}
  .tk img.ic{object-fit:cover;background:#fff}
  .tk h1{font-size:30px;font-weight:500;letter-spacing:-.025em;line-height:1.1}
  .tk h1 .sym{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--mut);font-size:24px}
  .addr{display:inline-flex;align-items:center;gap:9px;margin-top:9px;font-family:var(--mono);font-size:12.5px;color:var(--mut);background:var(--bg);border:1px solid var(--line);padding:6px 12px;border-radius:999px}
  .addr .cp{cursor:pointer;color:var(--faint)} .addr .cp:hover{color:var(--ink)}
  .addr a{color:var(--mut);text-decoration:none} .addr a:hover{color:var(--ink)}

  .status{margin-top:26px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 20px;border-radius:14px;border:1px solid var(--line)}
  .status.on{background:var(--hold-bg);border-color:rgba(14,159,110,.25)}
  .status.off{background:var(--red-bg);border-color:rgba(210,60,60,.2)}
  .status .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .status.on .dot{background:var(--hold);box-shadow:0 0 0 4px rgba(14,159,110,.15)}
  .status.off .dot{background:var(--red)}
  .status .txt{font-weight:500;font-size:15px}
  .status.on .txt{color:var(--hold)} .status.off .txt{color:var(--red)}
  .mode{margin-left:auto;font-size:10.5px;font-weight:600;letter-spacing:.02em;padding:5px 11px;border-radius:999px}
  .mode.a{color:var(--burn);background:var(--burn-bg)}
  .mode.c{color:var(--hold);background:var(--hold-bg)}
  .mode.h{color:var(--heart);background:var(--heart-bg)}
  .mode.off{color:var(--faint);background:rgba(18,21,19,.06)}

  .prow{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;transition:background .12s}
  .prow:hover{background:rgba(18,21,19,.025)}
  .prow .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px;font-family:var(--mono);flex:none;background:var(--ink);color:var(--bg)}
  .prow img.ic{object-fit:cover;background:#fff}
  .prow .nm{font-weight:500;font-size:14.5px}
  .prow .tick{color:var(--faint);font-size:12.5px;font-family:var(--mono)}
  .prow .mode{margin-left:10px}
  .prow .metric{margin-left:auto;text-align:right}
  .prow .metric .v{font-family:var(--mono);font-weight:500;font-size:14px}
  .prow .metric .l{font-size:11px;color:var(--faint)}

  /* charity allocation panel on token pages */
  .btn{font-size:13px;font-weight:500;padding:9px 18px;border-radius:999px;border:0;cursor:pointer;font-family:var(--sans);transition:.15s}
  .btn.h{color:#fff;background:var(--heart)} .btn.h:hover{opacity:.88}
  .btn.s{color:var(--ink);border:1px solid rgba(18,21,19,.18);background:transparent} .btn.s:hover{border-color:var(--ink)}
  .btn.mini{padding:7px 13px;font-size:12px}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .orgline{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;padding:9px 2px;border-bottom:1px solid var(--line)}
  .alloc-rows{margin-top:10px;display:flex;flex-direction:column;gap:8px}
  .alloc-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .alloc-row select{font:inherit;font-size:13px;padding:8px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  .alloc-row input[type=number]{font:inherit;font-size:13px;width:70px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  .alloc-row .rm{background:none;border:0;color:var(--faint);cursor:pointer;font-size:16px;padding:4px}
  .alloc-row .rm:hover{color:var(--red)}
  .alloc-foot{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
  .total-badge{font-family:var(--mono);font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;background:var(--red-bg);color:var(--red)}
  .total-badge.ok{background:var(--hold-bg);color:var(--hold)}
  .status .sub{flex-basis:100%;font-size:13px;color:var(--mut)}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:18px}
  .st{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .st .l{font-size:11px;color:var(--faint);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
  .st .v{font-size:22px;font-weight:500;margin-top:8px;font-family:var(--mono);letter-spacing:-.01em}
  .st .v.a{color:var(--burn)} .st .v.c{color:var(--hold)}
  .st .v small{font-size:13px;color:var(--faint)}

  .prog{height:6px;border-radius:4px;background:rgba(18,21,19,.07);overflow:hidden;margin-top:18px}
  .prog i{display:block;height:100%;border-radius:4px;background:var(--burn);width:0;transition:width .6s}

  .foot{margin-top:22px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13.5px}
  .foot a{color:var(--ink);text-decoration:none;font-weight:500;border-bottom:1px solid var(--line)}
  .foot a:hover{border-color:var(--ink)}
  .foot .sp{flex:1}
  .muted{color:var(--faint);font-size:12.5px}
  .loading{padding:64px 0;text-align:center;color:var(--mut)}
  .spin{width:24px;height:24px;border:2px solid rgba(18,21,19,.15);border-top-color:var(--ink);border-radius:50%;display:inline-block;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .err{padding:44px 26px;text-align:center;color:var(--mut)}
  .err a{color:var(--ink)}

  /* == pons-fork-footer == */
  .site-footer{border-top:1px solid var(--line);margin-top:44px}
  .site-footer .wrap{padding-top:52px;padding-bottom:30px}
  .site-footer .ft-top{display:grid;grid-template-columns:1.6fr 1fr 1fr 1.4fr;gap:40px}
  .site-footer .ft-brand .logo{font-family:var(--serif);font-size:34px;line-height:1;letter-spacing:-.01em;color:var(--ink)}
  .site-footer .ft-brand .logo .fork{font-style:italic}
  .site-footer .ft-brand p{margin-top:16px;font-size:13.5px;line-height:1.65;color:var(--mut);max-width:34ch}
  .site-footer .ft-col h4,.site-footer .ft-risk h4{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:16px}
  .site-footer .ft-col a{display:block;text-decoration:none;color:var(--mut);font-size:13.5px;padding:6px 0;transition:color .12s}
  .site-footer .ft-col a:hover{color:var(--ink)}
  .site-footer .ft-col a .tag{font-size:11px;color:var(--faint);margin-left:6px}
  .site-footer .ft-col a .heart{color:var(--heart)}
  .site-footer .ft-col a .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:8px;vertical-align:middle}
  .site-footer .d-burn{background:var(--burn)}.site-footer .d-hold{background:var(--hold)}.site-footer .d-heart{background:var(--heart)}
  .site-footer .ft-risk p{font-size:12.5px;line-height:1.7;color:var(--mut)}
  .site-footer .ft-risk .ca{display:inline-flex;align-items:center;gap:8px;margin-top:16px;font-family:var(--mono);font-size:11.5px;color:var(--mut);background:var(--card);border:1px solid var(--line);padding:7px 12px;border-radius:999px;text-decoration:none}
  .site-footer .ft-risk .ca b{color:var(--ink);font-family:var(--sans);font-weight:600}
  .site-footer .ft-risk .ca .cp{color:var(--faint)}.site-footer .ft-risk .ca:hover .cp{color:var(--ink)}
  .site-footer .ft-bar{border-top:1px solid var(--line);margin-top:40px;padding-top:22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .site-footer .ft-bar .cc{font-size:12px;color:var(--faint)}
  .site-footer .ft-bar .cc a{color:var(--mut);text-decoration:none}
  .site-footer .ft-bar .sp{flex:1}
  .site-footer .ft-bar .soc{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--mut);font-size:12.5px;border:1px solid rgba(18,21,19,.18);padding:7px 13px;border-radius:999px;transition:.12s}
  .site-footer .ft-bar .soc:hover{color:var(--ink);border-color:var(--ink)}
  .v2soon{display:inline-block;font-size:9.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#7c5cff;background:rgba(124,92,255,.12);border:1px solid rgba(124,92,255,.25);padding:2px 7px;border-radius:999px;margin-left:2px;vertical-align:middle}
  @media(max-width:820px){.site-footer .ft-top{grid-template-columns:1fr 1fr;gap:32px}.site-footer .ft-brand{grid-column:1/-1}}
  @media(max-width:520px){.site-footer .ft-top{grid-template-columns:1fr 1fr}.site-footer .ft-risk{grid-column:1/-1}}
  </style>
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <a class="brand" href="/" aria-label="Pons Fork — home"><img class="brand-logo" src="/logo.jpg" alt="Pons Fork" width="400" height="400" /></a>
    <div class="sp"></div>
    <a class="link" href="/#how">How it works</a>
    <a class="link" href="/charity/" style="color:#d6336c;font-weight:500">Charity ♥</a>
    <a class="link" href="/analytics/">Analytics</a>
    <a class="link" href="https://pons-fork.gitbook.io/pons-fork-docs/">Docs ↗</a>
    <span class="v2soon">V2 soon</span>
    <a class="link" href="https://x.com/ponsfork_">X ↗</a>
    <span class="connect"><button id="nav-connect">Connect wallet</button></span>
  </nav>

  <div id="app">
    <div class="card"><div class="loading"><span class="spin"></span><div style="margin-top:14px">Reading Robinhood Chain…</div></div></div>
  </div>
</div>

<script type="module">
import { createPublicClient, http, fallback, getAddress, isAddress, formatUnits, erc20Abi, parseAbi, decodeFunctionData } from "https://esm.sh/viem@2.23.2";

const RPC="https://rpc.mainnet.chain.robinhood.com";
const EXPLORER="https://robinhoodchain.blockscout.com";
const LOCKER="0x736D76699C26D0d966744cAe304C000d471f7F35";
const FACTORY="0xA5aAb3F0c6EeadF30Ef1D3Eb997108E976351feB";
const AGENTIC="0x31A4F14D8ac9E89F2Ac6000b375B125468Cd1AF3";
const CASHBACK="0x6ab6bD6416997Ad39cBDA34C9b2Fc912D57A8eF4";
const CHARITY="0x416C762f134B48Ef303bB0b8cAF7D1DB86F719d2";
const DEAD="0x000000000000000000000000000000000000dEaD";

const lockerAbi=parseAbi(["function feeRedirects(address) view returns (address)","function collectFees(address) returns (uint256,uint256)"]);
const factoryAbi=parseAbi(["function getLaunchedToken(address token) view returns ((address token,address deployer,address pairedToken,address positionManager,uint256 positionId,uint256 dexId,uint256 launchConfigId,uint256 restrictionsEndBlock,uint256 supply,bool isToken0,uint24 poolFee,bool exists,uint256 initialBuyAmount) info)"]);
const deployedEvent=parseAbi(["event TokenDeployed(address indexed token,address indexed deployer,address indexed dexFactory,address pairToken,uint256 dexId,uint256 launchConfigId)"])[0];
const launchAbi=parseAbi(["function launchToken((string name,string symbol,string logo,string description,(string twitter,string telegram,string discord,string website,string farcaster) socials,address feeWallet) params,uint256 launchConfigId,uint256 dexId,bytes32 salt) payable returns (address)"]);
const pc=createPublicClient({transport:fallback([http(RPC),http("https://rpc.arrowrpc.com")])});
const app=document.getElementById("app");
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const short=a=>a.slice(0,6)+"…"+a.slice(-4);
const ipfsHttp=u=>!u?"":(u.startsWith("ipfs://")?"https://ipfs.io/ipfs/"+u.slice(7).replace(/^ipfs\//,""):u);
// Token logo lives only in the launchToken() tx calldata (IPFS URI); fetch it via the indexed launch log.
async function tokenLogo(token){
  try{
    const logs=await pc.getLogs({address:FACTORY,event:deployedEvent,args:{token},fromBlock:0n,toBlock:"latest"});
    if(!logs.length)return "";
    const tx=await pc.getTransaction({hash:logs[0].transactionHash});
    const {args}=decodeFunctionData({abi:launchAbi,data:tx.input});
    return ipfsHttp(args[0].logo);
  }catch(e){return "";}
}
function fmt(n){ if(n>=1e9)return (n/1e9).toFixed(2)+"B"; if(n>=1e6)return (n/1e6).toFixed(2)+"M"; if(n>=1e3)return (n/1e3).toFixed(2)+"K"; return n<1?n.toFixed(3):Math.round(n).toString(); }

function readRoute(){
  const p=location.pathname;
  const pm=p.match(/\/profile\/(0x[0-9a-fA-F]{40})/);
  if(pm) return {mode:"profile", addr:pm[1]};
  const i=p.indexOf("/token/");
  let a = i>=0 ? p.slice(i+7) : "";
  a=a.replace(/\/+$/,"").split("?")[0].split("#")[0];
  if(!a){ const u=new URLSearchParams(location.search); a=u.get("a")||u.get("address")||""; }
  return {mode:"token", addr:a};
}

async function main(){
  const route=readRoute();
  if(route.mode==="profile"){ await renderProfile(route.addr); return; }
  const raw=route.addr;
  if(!raw || !isAddress(raw)){
    app.innerHTML=`<div class="card"><div class="err">Open a token by its address:<br><span class="mono">ponsfork.com/token/0x…</span><br><br><a href="../">← back to Pons Fork</a></div></div>`;
    return;
  }
  const token=getAddress(raw);
  document.title=short(token)+" · Pons Fork";
  try{
    const [name,symbol,supply,decimals,burnedBal,redir,info]=await Promise.all([
      pc.readContract({address:token,abi:erc20Abi,functionName:"name"}).catch(()=> "Unknown"),
      pc.readContract({address:token,abi:erc20Abi,functionName:"symbol"}).catch(()=> "?"),
      pc.readContract({address:token,abi:erc20Abi,functionName:"totalSupply"}).catch(()=>0n),
      pc.readContract({address:token,abi:erc20Abi,functionName:"decimals"}).catch(()=>18),
      pc.readContract({address:token,abi:erc20Abi,functionName:"balanceOf",args:[DEAD]}).catch(()=>0n),
      pc.readContract({address:LOCKER,abi:lockerAbi,functionName:"feeRedirects",args:[token]}).catch(()=>"0x0000000000000000000000000000000000000000"),
      pc.readContract({address:FACTORY,abi:factoryAbi,functionName:"getLaunchedToken",args:[token]}).catch(()=>null),
    ]);
    const dec=Number(decimals);
    const sup=Number(formatUnits(supply,dec));
    const burned=Number(formatUnits(burnedBal,dec));
    const burnedPct = sup>0 ? (burned/sup*100) : 0;
    const recip=getAddress(redir);
    const isAgentic = recip===getAddress(AGENTIC);
    const isCashback = recip===getAddress(CASHBACK);
    const isCharity = recip===getAddress(CHARITY);
    const enabled = isAgentic || isCashback || isCharity;
    const deployer = info ? info.deployer : "";

    // cumulative totals (cashback payouts / charity donations) — from the published stats
    let distEth = "0", donEth = "0";
    try {
      const st = await (await fetch("https://raw.githubusercontent.com/ponsfork/pons-fork-stats/main/stats.json?t="+Date.now())).json();
      const rec = st.tokens?.[token.toLowerCase()] || {};
      const f = (w) => { const v = Number(formatUnits(BigInt(w || "0"), 18)); return v >= 1 ? v.toFixed(3) : v.toFixed(4); };
      distEth = f(rec.distributedWei);
      donEth = f(rec.charityDonatedWei);
    } catch (e) {}

    const statusHtml = enabled
      ? `<div class="status on"><span class="dot"></span><span class="txt">Pons Fork enabled</span>
           <span class="mode ${isAgentic?'a':isCashback?'c':'h'}">${isAgentic?'Agentic Mode · Buyback & Burn':isCashback?'Cashback · Holder rewards':'Charity · Fees to good causes'}</span>
           <span class="sub">Fees are routed to Pons Fork right now — ${isAgentic?'bought back &amp; burned':isCashback?'paid to holders in ETH':'donated to the causes the dev picked (0% service fee)'}, automatically.</span></div>`
      : `<div class="status off"><span class="dot"></span><span class="txt">Not connected</span>
           <span class="sub">This token's fees are not routed to Pons Fork right now. Only the token's dev can point them at Agentic Mode, Cashback or Charity.</span></div>`;

    app.innerHTML=`
      <div class="card">
        <div class="tk">
          <div class="ic">${esc(String(symbol).slice(0,3).toUpperCase())}</div>
          <div><h1>${esc(name)} <span class="sym">$${esc(symbol)}</span></h1>
            <div class="addr"><span>${short(token)}</span><span class="cp" id="cp" title="copy">⧉</span>
              <a href="${EXPLORER}/address/${token}" target="_blank">explorer ↗</a></div>
          </div>
        </div>
        ${statusHtml}
        <div class="stats">
          ${isCashback
            ? `<div class="st"><div class="l">ETH distributed</div><div class="v c">${distEth}<small> ETH</small></div></div>`
            : isCharity
            ? `<div class="st"><div class="l">ETH donated</div><div class="v" style="color:var(--heart)">${donEth}<small> ETH</small></div></div>`
            : `<div class="st"><div class="l">Supply burned</div><div class="v a">${burnedPct.toFixed(2)}<small>%</small></div></div>`}
          <div class="st"><div class="l">Tokens burned</div><div class="v">${fmt(burned)}</div></div>
          <div class="st"><div class="l">Total supply</div><div class="v">${fmt(sup)}</div></div>
          <div class="st"><div class="l">Deployer</div><div class="v" style="font-size:14px">${deployer?`<a href="/profile/${deployer}" style="color:inherit;text-decoration:none;border-bottom:1px solid var(--line)" title="view deployer profile">${short(deployer)}</a>`:"—"}</div></div>
        </div>
        <div class="prog"><i style="width:${Math.min(burnedPct,100)}%"></i></div>
        <div class="foot">
          <a href="https://www.ponsfamily.com/launchpad/${token}" target="_blank">Trade on Pons ↗</a>
          <a href="${EXPLORER}/address/${token}" target="_blank">View on explorer ↗</a>
        </div>
      </div>
      <div class="foot" style="justify-content:center;margin-top:16px"><a href="../">← All Pons Fork tokens</a></div>`;

    const cp=document.getElementById("cp");
    if(cp) cp.onclick=()=>{navigator.clipboard?.writeText(token);cp.textContent="✓";setTimeout(()=>cp.textContent="⧉",1200);};
    // Swap the text avatar for the real pons logo once it resolves; keep text on failure.
    tokenLogo(token).then(src=>{
      if(!src)return; const cur=document.querySelector(".tk .ic"); if(!cur)return;
      const img=document.createElement("img"); img.className="ic"; img.src=src; img.alt="";
      img.onerror=()=>{const d=document.createElement("div");d.className="ic";d.textContent=String(symbol).slice(0,3).toUpperCase();img.replaceWith(d);};
      cur.replaceWith(img);
    });
    // Charity tokens get the full allocation panel right on their page.
    if(isCharity){ renderCharityPanel(token, deployer, info).catch(()=>{}); }
  }catch(e){
    app.innerHTML=`<div class="card"><div class="err">Couldn't load this token.<br><span class="muted">${esc(e.message||"")}</span><br><br><a href="../">← back to Pons Fork</a></div></div>`;
  }
}
// ── charity allocation panel (shown on charity-mode token pages) ──────────
const CH_ORGS=[
  {id:"stjude",  name:"St. Jude Children's Research Hospital", address:"0x92EE2370b56DC32794A6CD72585dC01d4288D314"},
  {id:"givewell",name:"GiveWell",                              address:"0x4647c3b4c5ba4efa6d8197331de00c26ce36e8e6"},
  {id:"eff",     name:"Electronic Frontier Foundation",        address:"0x1ca9EB2a5C213d417269134b80111F57e1644105"},
  {id:"fpf",     name:"Freedom of the Press Foundation",       address:"0xC423F8aEDf1753Bc0ab58e455B0b5421CafE949e"},
];
let chAccount=null;

// current split = latest valid on-chain memo (PONS|token|id:pct,...) from the deployer
async function readAllocation(token,deployer){
  try{
    const r=await (await fetch(`${EXPLORER}/api?module=account&action=txlist&address=${CHARITY}&sort=asc`)).json();
    let cur=null;
    for(const t of (r.result||[])){
      if(!t.to||t.to.toLowerCase()!==CHARITY.toLowerCase())continue;
      if(!deployer||t.from.toLowerCase()!==deployer.toLowerCase())continue;
      if(t.isError==="1"||!t.input||t.input==="0x")continue;
      let txt="";try{txt=new TextDecoder().decode(Uint8Array.from(t.input.slice(2).match(/.{2}/g).map(h=>parseInt(h,16))));}catch{continue;}
      const m=txt.match(/^PONS\|(0x[0-9a-fA-F]{40})\|([a-z]+:\d+(?:,[a-z]+:\d+)*)$/);
      if(!m||m[1].toLowerCase()!==token.toLowerCase())continue;
      const parts=m[2].split(",").map(p=>{const[id,pct]=p.split(":");return{id,pct:Number(pct)};});
      const ok=parts.every(p=>CH_ORGS.some(o=>o.id===p.id)&&Number.isInteger(p.pct)&&p.pct>0)&&parts.reduce((a,b)=>a+b.pct,0)===100&&new Set(parts.map(p=>p.id)).size===parts.length;
      if(ok)cur=parts; // asc order → latest memo wins
    }
    return cur;
  }catch(e){return null;}
}

async function renderCharityPanel(token,deployer,info){
  const card=document.createElement("div");
  card.className="card";card.style.marginTop="16px";
  card.innerHTML=`<h1 style="font-size:20px;font-weight:500">Charity allocation <span style="color:var(--heart)">♥</span></h1>
    <div id="ch-sub" style="font-size:13px;color:var(--mut);margin-top:6px">reading on-chain allocation…</div>
    <div id="ch-body" style="margin-top:10px"></div>
    <div id="ch-edit" style="margin-top:14px"></div>`;
  app.appendChild(card);
  const body=card.querySelector("#ch-body"),sub=card.querySelector("#ch-sub"),edit=card.querySelector("#ch-edit");

  let claimable="0.00000";
  try{const sim=await pc.simulateContract({account:CHARITY,address:LOCKER,abi:lockerAbi,functionName:"collectFees",args:[token]});const[a0,a1]=sim.result;const w=(info&&info.isToken0)?a1:a0;claimable=(+formatUnits(w,18)).toFixed(5);}catch(e){}

  const cur=await readAllocation(token,deployer);
  let orgStats={};
  try{const st=await (await fetch("https://raw.githubusercontent.com/ponsfork/pons-fork-stats/main/stats.json?t="+Date.now())).json();orgStats=(st.tokens?.[token.toLowerCase()]||{}).charityOrgs||{};}catch(e){}
  const fE=w=>{const v=Number(formatUnits(BigInt(w||"0"),18));return v>=1?v.toFixed(3):v.toFixed(4);};

  sub.textContent=cur
    ?("fees are split: "+cur.map(p=>p.pct+"% "+(CH_ORGS.find(o=>o.id===p.id)?.name||p.id)).join(" · "))
    :"no allocation yet — claimed fees are held until the deployer picks the causes";

  let rows=`<div class="orgline" style="border-top:1px solid var(--line)"><span style="color:var(--faint)">Claimable for charity right now</span><span class="mono">${claimable} ETH</span></div>`;
  for(const o of CH_ORGS){
    const rec=orgStats[o.address.toLowerCase()]||{};
    const pct=cur?cur.find(p=>p.id===o.id)?.pct:undefined;
    if(!pct&&!(Number(rec.ethWei)>0)&&!(Number(rec.tok)>0))continue;
    const tokPart=Number(rec.tok)>0?` + ${fmt(Number(formatUnits(BigInt(rec.tok),18)))} tokens`:"";
    rows+=`<div class="orgline"><span>${pct?`<b>${pct}%</b> · `:""}${esc(o.name)}</span><span class="mono">${fE(rec.ethWei)} ETH${tokPart}</span></div>`;
  }
  body.innerHTML=rows;

  edit.innerHTML=`<button class="btn h" id="ch-connect">Connect wallet to manage</button>
    <div style="margin-top:6px;font-size:12px;color:var(--faint)">only the deployer (${deployer?short(deployer):"—"}) can change the split</div>`;
  edit.querySelector("#ch-connect").onclick=()=>chConnect(token,deployer,cur,edit);
}

async function chConnect(token,deployer,cur,edit){
  if(!window.ethereum){edit.innerHTML='<span style="color:var(--red);font-size:13px">No wallet found — install MetaMask (or any EIP-1193 wallet) and reload.</span>';return;}
  try{
    const accs=await window.ethereum.request({method:"eth_requestAccounts"});
    chAccount=getAddress(accs[0]);
    const cid=await window.ethereum.request({method:"eth_chainId"});
    if(cid!=="0x1237"){
      try{await window.ethereum.request({method:"wallet_switchEthereumChain",params:[{chainId:"0x1237"}]});}
      catch(e){if(e.code===4902){await window.ethereum.request({method:"wallet_addEthereumChain",params:[{chainId:"0x1237",chainName:"Robinhood Chain",nativeCurrency:{name:"Ether",symbol:"ETH",decimals:18},rpcUrls:[RPC],blockExplorerUrls:[EXPLORER]}]});}else throw e;}
    }
    if(!deployer||chAccount.toLowerCase()!==deployer.toLowerCase()){
      edit.innerHTML=`<span style="color:var(--red);font-size:13px">Connected ${short(chAccount)} is not the deployer — only ${deployer?short(deployer):"the deployer"} can manage this token's split.</span>`;
      return;
    }
    renderEditor(token,cur,edit);
  }catch(e){edit.innerHTML='<span style="color:var(--red);font-size:13px">Connection failed: '+esc(e.message||e)+'</span>';}
}

function renderEditor(token,cur,edit){
  edit.innerHTML=`<div class="alloc-rows"></div>
    <div class="alloc-foot"><button class="btn s mini" id="al-add">+ Add cause</button><span class="total-badge" id="al-total">0%</span><button class="btn h mini" id="al-save" disabled>Save allocation ♥</button></div>
    <div id="al-note" style="margin-top:8px;font-size:12px;color:var(--faint)"></div>`;
  const rowsEl=edit.querySelector(".alloc-rows"),totalEl=edit.querySelector("#al-total"),saveBtn=edit.querySelector("#al-save");
  function addRow(id,pct){
    const r=document.createElement("div");r.className="alloc-row";
    r.innerHTML=`<select>${CH_ORGS.map(o=>`<option value="${o.id}"${o.id===id?" selected":""}>${esc(o.name)}</option>`).join("")}</select><input type="number" min="1" max="100" step="1" value="${pct??100}"/><span style="color:var(--faint)">%</span><button class="rm" title="remove">×</button>`;
    r.querySelector(".rm").onclick=()=>{r.remove();recalc();};
    r.querySelector("select").onchange=recalc;r.querySelector("input").oninput=recalc;
    rowsEl.appendChild(r);
  }
  const parts=()=>[...rowsEl.querySelectorAll(".alloc-row")].map(r=>({id:r.querySelector("select").value,pct:Math.round(Number(r.querySelector("input").value)||0)}));
  function recalc(){const p=parts();const total=p.reduce((a,b)=>a+b.pct,0);const dup=new Set(p.map(x=>x.id)).size!==p.length;totalEl.textContent=total+"%"+(dup?" · duplicate":"");totalEl.className="total-badge"+(total===100&&!dup&&p.length?" ok":"");saveBtn.disabled=!(total===100&&!dup&&p.length&&p.every(x=>x.pct>0));}
  edit.querySelector("#al-add").onclick=()=>{if(rowsEl.children.length<CH_ORGS.length){addRow(undefined,0);recalc();}};
  saveBtn.onclick=async()=>{
    const p=parts();saveBtn.disabled=true;saveBtn.textContent="Confirm in wallet…";
    try{
      const memo=`PONS|${token}|${p.map(x=>`${x.id}:${x.pct}`).join(",")}`;
      const bytes=new TextEncoder().encode(memo);
      const data="0x"+[...bytes].map(b=>b.toString(16).padStart(2,"0")).join("");
      const tx=await window.ethereum.request({method:"eth_sendTransaction",params:[{from:chAccount,to:CHARITY,value:"0x0",data}]});
      saveBtn.textContent="Saved on-chain ✓";
      edit.querySelector("#al-note").innerHTML=`allocation updated · <a href="${EXPLORER}/tx/${tx}" target="_blank" style="color:inherit">tx ↗</a> — the engine applies it within ~1 minute`;
      setTimeout(()=>{saveBtn.disabled=false;saveBtn.textContent="Save allocation ♥";},4000);
    }catch(e){saveBtn.disabled=false;saveBtn.textContent="Save allocation ♥";alert("Transaction rejected or failed: "+(e.message||e));}
  };
  if(cur&&cur.length)cur.forEach(p=>addRow(p.id,p.pct));else addRow(CH_ORGS[0].id,100);
  recalc();
}

// ── deployer profile: /profile/0x… — every pons deploy of a wallet, live ──
// ── wallet ↔ X (Twitter) linking (backend: api.ponsfork.com) ──
const API_BASE="https://api.ponsfork.com";
const PROFILES_URL="https://raw.githubusercontent.com/ponsfork/pons-fork-profiles/main/profiles.json";
let _profiles=null;
async function readProfiles(){
  if(_profiles) return _profiles;
  let raw={};
  try{ raw=((await (await fetch(API_BASE+"/profiles.json?t="+Date.now())).json()).profiles)||{}; }
  catch(e){ try{ raw=((await (await fetch(PROFILES_URL+"?t="+Date.now())).json()).profiles)||{}; }catch(e2){ raw={}; } }
  _profiles={}; for(const [k,v] of Object.entries(raw)) _profiles[k.toLowerCase()]=v; return _profiles;
}
function pfToast(m){
  let t=document.getElementById("pf-toast");
  if(!t){ t=document.createElement("div"); t.id="pf-toast"; t.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#121513;color:#f6f6f1;padding:10px 16px;border-radius:10px;font-size:13px;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.22);transition:opacity .3s"; document.body.appendChild(t); }
  t.textContent=m; t.style.opacity="1"; clearTimeout(t._h); t._h=setTimeout(()=>{t.style.opacity="0";},3200);
}
// these strings MUST match the backend (src/lib/wallet.ts) byte-for-byte
function xLinkMsg(wallet,handle,nonce){ return ["Pons Fork — link X account","wallet: "+getAddress(wallet),"handle: @"+handle,"This link will be shown publicly on ponsfork.com.","nonce: "+nonce].join("\n"); }
function xUnlinkMsg(wallet){ return ["Pons Fork — unlink X account","wallet: "+getAddress(wallet)].join("\n"); }
const utf8Hex=s=>"0x"+[...new TextEncoder().encode(s)].map(b=>b.toString(16).padStart(2,"0")).join("");
async function xAccount(){ if(!window.ethereum) return null; const a=await window.ethereum.request({method:"eth_requestAccounts"}).catch(()=>[]); return (a&&a[0])?getAddress(a[0]):null; }

async function xConnect(who){
  if(!window.ethereum){ pfToast("No wallet found — install a wallet and reload."); return; }
  const acc=await xAccount(); if(!acc) return;
  if(acc!==who){ if(confirm("This profile belongs to a different wallet. Open your own profile?")) location.href="/profile/"+acc; return; }
  location.href=API_BASE+"/x/start?wallet="+who;
}
async function xUnlink(who){
  const acc=await xAccount(); if(!acc) return;
  if(acc!==who){ pfToast("Connect "+short(who)+" to unlink."); return; }
  let sig; try{ sig=await window.ethereum.request({method:"personal_sign",params:[utf8Hex(xUnlinkMsg(who)),acc]}); }catch(e){ return; }
  try{ const r=await fetch(API_BASE+"/unlink",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({wallet:who,signature:sig})}); const j=await r.json(); if(j.ok){ pfToast("Unlinked ✓"); setTimeout(()=>location.reload(),700); } else pfToast(j.error||"unlink failed"); }
  catch(e){ pfToast("unlink failed"); }
}
// after returning from X OAuth: /profile/<wallet>?xlink=<nonce>&handle=<h>
async function handleXCallback(who){
  const q=new URLSearchParams(location.search); const nonce=q.get("xlink"); if(!nonce) return;
  const handle=q.get("handle"); const clean=()=>history.replaceState({},"","/profile/"+who);
  if(nonce==="error"||nonce==="expired"||!handle){ pfToast("X connect failed — try again."); clean(); return; }
  if(!window.ethereum){ pfToast("Open in a wallet browser to finish linking."); return; }
  const acc=await xAccount();
  if(acc!==who){ pfToast("Connect "+short(who)+" to finish linking @"+handle+"."); return; }
  let sig; try{ sig=await window.ethereum.request({method:"personal_sign",params:[utf8Hex(xLinkMsg(who,handle,nonce)),acc]}); }catch(e){ pfToast("Signature cancelled."); return; }
  try{
    const r=await fetch(API_BASE+"/link",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({wallet:who,nonce,signature:sig})});
    const j=await r.json();
    if(j.ok){ pfToast("Linked @"+j.handle+" ✓"); clean(); setTimeout(()=>location.reload(),900); }
    else { pfToast(j.error||"link failed"); clean(); }
  }catch(e){ pfToast("link failed"); }
}
// inject the X row into the profile header + wire buttons
async function mountX(who){
  const prof=(await readProfiles())[who.toLowerCase()];
  const head=app.querySelector(".tk > div:last-child");
  if(head){
    const row=document.createElement("div");
    row.style.cssText="margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px";
    const btn="cursor:pointer;font:inherit;font-size:12.5px;font-weight:500;color:#f6f6f1;background:#121513;border:0;padding:6px 13px;border-radius:999px";
    if(prof){
      row.innerHTML='<a href="https://x.com/'+esc(prof.handle)+'" target="_blank" style="text-decoration:none;font-weight:500;color:var(--ink);border-bottom:1px solid var(--line)">𝕏 @'+esc(prof.handle)+'</a><span class="muted" style="font-size:11.5px;color:var(--hold,#0e9f6e)">✓ verified</span><span style="flex:1"></span><a id="xunlink" class="muted" style="cursor:pointer;font-size:12px;border-bottom:1px solid var(--line)">unlink</a>';
    } else {
      row.innerHTML='<span class="muted" style="font-size:12.5px">No X linked</span><button id="xbtn" style="'+btn+'">Connect 𝕏</button>';
    }
    head.appendChild(row);
    const b=document.getElementById("xbtn"); if(b) b.onclick=()=>xConnect(who);
    const u=document.getElementById("xunlink"); if(u) u.onclick=()=>xUnlink(who);
  }
  await handleXCallback(who);
}

// reflect an already-connected wallet in the nav button
(async()=>{ try{ if(window.ethereum){ const a=await window.ethereum.request({method:"eth_accounts"}); if(a&&a[0]){ const b=document.getElementById("nav-connect"); if(b) b.textContent=getAddress(a[0]).slice(0,6)+"\u2026"+getAddress(a[0]).slice(-4); } } }catch(e){} })();
async function renderProfile(addrRaw){
  const who=getAddress(addrRaw);
  document.title="Profile "+short(who)+" · Pons Fork";
  try{
    const logs=await pc.getLogs({address:FACTORY,event:deployedEvent,args:{deployer:who},fromBlock:8600612n,toBlock:"latest"});
    const tokens=[...new Set(logs.map(l=>getAddress(l.args.token)))];
    let stats={};
    try{stats=((await (await fetch("https://raw.githubusercontent.com/ponsfork/pons-fork-stats/main/stats.json?t="+Date.now())).json()).tokens)||{};}catch(e){}
    const fEth=w=>{const v=Number(formatUnits(BigInt(w||"0"),18));return v>=1?v.toFixed(3):v.toFixed(4);};
    let rowsHtml="";
    const metas=[];
    for(const t of tokens){
      const [name,symbol,supply,decimals,deadBal,redir]=await Promise.all([
        pc.readContract({address:t,abi:erc20Abi,functionName:"name"}).catch(()=>"Unknown"),
        pc.readContract({address:t,abi:erc20Abi,functionName:"symbol"}).catch(()=>"?"),
        pc.readContract({address:t,abi:erc20Abi,functionName:"totalSupply"}).catch(()=>0n),
        pc.readContract({address:t,abi:erc20Abi,functionName:"decimals"}).catch(()=>18),
        pc.readContract({address:t,abi:erc20Abi,functionName:"balanceOf",args:[DEAD]}).catch(()=>0n),
        pc.readContract({address:LOCKER,abi:lockerAbi,functionName:"feeRedirects",args:[t]}).catch(()=>"0x0000000000000000000000000000000000000000"),
      ]);
      const r=getAddress(redir);
      const dec=Number(decimals),ts=Number(formatUnits(supply,dec)),bn=Number(formatUnits(deadBal,dec));
      const pct=ts>0?bn/ts*100:0;
      const rec=stats[t.toLowerCase()]||{};
      let badge,metric;
      if(r===getAddress(AGENTIC)){badge='<span class="mode a">Agentic Mode</span>';metric=`<div class="metric"><div class="v">${pct.toFixed(2)}%</div><div class="l">supply burned</div></div>`;}
      else if(r===getAddress(CASHBACK)){badge='<span class="mode c">Cashback</span>';metric=`<div class="metric"><div class="v">${fEth(rec.distributedWei)}</div><div class="l">ETH distributed</div></div>`;}
      else if(r===getAddress(CHARITY)){badge='<span class="mode h">Charity</span>';metric=`<div class="metric"><div class="v">${fEth(rec.charityDonatedWei)}</div><div class="l">ETH donated</div></div>`;}
      else{badge='<span class="mode off">not on Pons Fork</span>';metric='<div class="metric"><div class="v">—</div><div class="l"></div></div>';}
      metas.push({t,sym:String(symbol)});
      rowsHtml+=`<a class="prow" href="/token/${t}" data-t="${t}"><div class="ic">${esc(String(symbol).slice(0,3).toUpperCase())}</div><div><div class="nm">${esc(name)}</div><div class="tick">$${esc(symbol)}</div></div>${badge}${metric}</a>`;
    }
    app.innerHTML=`
      <div class="card">
        <div class="tk">
          <div class="ic">DEV</div>
          <div><h1>Deployer <span class="sym">${short(who)}</span></h1>
            <div class="addr"><span>${short(who)}</span><span class="cp" id="cp" title="copy">⧉</span>
              <a href="${EXPLORER}/address/${who}" target="_blank">explorer ↗</a></div>
          </div>
        </div>
        <div style="margin-top:18px;border-top:1px solid var(--line)">
          ${rowsHtml||'<div class="err">No pons deploys found for this wallet.</div>'}
        </div>
        <div class="foot"><a href="/">← Pons Fork home</a><span class="sp"></span><span class="muted">${tokens.length} deploy${tokens.length===1?"":"s"} · live on-chain</span></div>
      </div>`;
    const cp=document.getElementById("cp");
    if(cp)cp.onclick=()=>{navigator.clipboard?.writeText(who);cp.textContent="✓";setTimeout(()=>cp.textContent="⧉",1200);};
    for(const {t,sym} of metas){
      tokenLogo(t).then(src=>{
        if(!src)return;const el=document.querySelector(`.prow[data-t="${t}"] .ic`);if(!el)return;
        const img=document.createElement("img");img.className="ic";img.src=src;img.alt="";
        img.onerror=()=>{const d=document.createElement("div");d.className="ic";d.textContent=sym.slice(0,3).toUpperCase();img.replaceWith(d);};
        el.replaceWith(img);
      });
    }
    await mountX(who);
  }catch(e){
    app.innerHTML=`<div class="card"><div class="err">Couldn't load this profile.<br><span class="muted">${esc(e.message||"")}</span><br><br><a href="/">← back</a></div></div>`;
  }
}
main();
